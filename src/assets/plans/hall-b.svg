<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond général -->
  <rect x="0" y="0" width="1000" height="700" fill="#f8fafc" />

  <!-- Mur extérieur du hall -->
  <rect x="10" y="10" width="980" height="680" fill="none" stroke="#94a3b8" stroke-width="6" />

  <!-- Grille légère des allées (repère visuel, pas fonctionnel) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="10" y1="220" x2="990" y2="220" />
    <line x1="10" y1="330" x2="990" y2="330" />
    <line x1="650" y1="10" x2="650" y2="690" />
    <line x1="820" y1="10" x2="820" y2="690" />
  </g>

  <!-- Filigrane nom du hall -->
  <text x="500" y="620" text-anchor="middle" font-family="sans-serif" font-size="120"
        fill="#e2e8f0" font-weight="700">HALL B</text>

  <!-- Colonnes de soutien (repère visuel) -->
  <g fill="#cbd5e1">
    <circle cx="650" cy="280" r="9" />
    <circle cx="820" cy="280" r="9" />
    <circle cx="650" cy="560" r="9" />
    <circle cx="820" cy="560" r="9" />
  </g>

  <!-- Entrée principale (haut du plan, à côté de l'espace accueil) -->
  <g>
    <rect x="350" y="10" width="120" height="20" fill="#0ea5e9" />
    <text x="410" y="48" text-anchor="middle" font-family="sans-serif" font-size="18"
          fill="#0f172a" font-weight="600">ENTRÉE</text>
  </g>

  <!-- Légende schématique -->
  <text x="30" y="670" font-family="sans-serif" font-size="16" fill="#94a3b8">
    Plan schématique — Hall B
  </text>
</svg>
