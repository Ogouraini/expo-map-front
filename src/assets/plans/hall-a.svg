<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond général -->
  <rect x="0" y="0" width="1200" height="800" fill="#f8fafc" />

  <!-- Mur extérieur du hall -->
  <rect x="10" y="10" width="1180" height="780" fill="none" stroke="#94a3b8" stroke-width="6" />

  <!-- Grille légère des allées (repère visuel, pas fonctionnel) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="10" y1="230" x2="1190" y2="230" />
    <line x1="10" y1="340" x2="1190" y2="340" />
    <line x1="750" y1="10" x2="750" y2="790" />
    <line x1="920" y1="10" x2="920" y2="790" />
  </g>

  <!-- Filigrane nom du hall -->
  <text x="600" y="700" text-anchor="middle" font-family="sans-serif" font-size="140"
        fill="#e2e8f0" font-weight="700">HALL A</text>

  <!-- Colonnes de soutien (repère visuel) -->
  <g fill="#cbd5e1">
    <circle cx="750" cy="300" r="10" />
    <circle cx="920" cy="300" r="10" />
    <circle cx="750" cy="620" r="10" />
    <circle cx="920" cy="620" r="10" />
  </g>

  <!-- Entrée principale (bas du plan) -->
  <g>
    <rect x="540" y="770" width="120" height="20" fill="#0ea5e9" />
    <text x="600" y="765" text-anchor="middle" font-family="sans-serif" font-size="18"
          fill="#0f172a" font-weight="600">ENTRÉE</text>
  </g>

  <!-- Légende schématique -->
  <text x="30" y="35" font-family="sans-serif" font-size="16" fill="#94a3b8">
    Plan schématique — Hall A
  </text>
</svg>
